<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL | Tactical Gallery</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Oswald:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- COLOR PALETTE & VARIABLES --- */
        :root {
            --bg-black: #090909;
            --card-grey: #1B1B1B;
            --crimson: #B50000;
            --dark-red: #600000;
            --gold: #D4AF37;
            --text-white: #F5F5F5;
            --text-muted: #A0A0A0;
            --font-primary: 'Montserrat', sans-serif;
            --font-heading: 'Oswald', sans-serif;
            --font-tactical: 'Rajdhani', sans-serif;
        }

        /* --- GLOBAL STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: var(--font-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 0 60px;
        }

        .section-title {
            text-align: center;
            font-size: 2.8rem;
            margin-bottom: 20px;
            position: relative;
            font-family: var(--font-tactical);
            letter-spacing: 3px;
        }

        .section-title span {
            color: var(--gold);
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: var(--crimson);
            margin: 10px auto 0;
            box-shadow: 0 0 8px var(--crimson);
        }

        /* --- NAVIGATION BAR --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            transition: all 0.4s ease;
            background: rgba(9, 9, 9, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        header.scrolled {
            background: rgba(9, 9, 9, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-text {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-tactical);
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-white);
            letter-spacing: 3px;
        }

        .nav-logo-img {
            height: 42px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 5px var(--crimson));
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            font-family: var(--font-tactical);
            font-size: 1.1rem;
            letter-spacing: 1px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--gold);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
        }

        .menu-toggle {
            display: none;
            color: var(--text-white);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* --- HERO BANNER --- */
        .gallery-hero {
            height: 35vh;
            background: linear-gradient(rgba(9, 9, 9, 0.5), rgba(9, 9, 9, 0.95)), 
                        url('images/hero-gradient.png') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 80px;
        }

        /* --- ALBUM SHARE BAR --- */
        .share-box {
            background: var(--card-grey);
            border-left: 4px solid var(--gold);
            padding: 20px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .share-info p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .share-info h3 {
            font-family: var(--font-tactical);
            font-size: 1.3rem;
            color: var(--text-white);
            letter-spacing: 1px;
        }

        .share-btn {
            background: transparent;
            border: 2px solid var(--crimson);
            color: var(--text-white);
            font-family: var(--font-tactical);
            font-weight: 700;
            padding: 10px 20px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .share-btn:hover {
            background: var(--crimson);
            box-shadow: 0 0 12px var(--crimson);
        }

        /* --- MASONRY GALLERY SYSTEM --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .gallery-card {
            position: relative;
            height: 280px;
            background: #111;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gallery-card:hover img {
            transform: scale(1.08);
        }

        .card-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(9,9,9,0.9) 10%, rgba(181,0,0,0.2) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .gallery-card:hover .card-overlay {
            opacity: 1;
        }

        .card-overlay h4 {
            font-family: var(--font-tactical);
            font-size: 1.3rem;
            color: var(--gold);
            letter-spacing: 1px;
        }

        .card-overlay p {
            font-size: 0.85rem;
            color: var(--text-white);
        }

        /* --- LIGHTBOX MODAL POPUP --- */
        .lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            max-width: 85%;
            max-height: 80vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 2px solid rgba(255,255,255,0.1);
        }

        .lightbox-close {
            position: absolute;
            top: 30px; right: 40px;
            color: var(--text-white);
            font-size: 2.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .lightbox-close:hover {
            color: var(--crimson);
        }

        /* --- FOOTER --- */
        footer {
            background: #050505;
            padding: 40px 0 30px;
            border-top: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* --- MOBILE LAYOUTS --- */
        @media screen and (max-width: 768px) {
            .share-box { flex-direction: column; text-align: center; gap: 20px; }
            .share-btn { width: 100%; justify-content: center; }
            .menu-toggle { display: block; }
            .nav-links {
                position: absolute;
                top: 100%; left: 0; width: 100%;
                background: var(--bg-black);
                flex-direction: column;
                gap: 0;
                max-height: 0;
                overflow: hidden;
                transition: all 0.4s ease;
            }
            .nav-links.active { max-height: 400px; border-bottom: 1px solid rgba(212,175,55,0.2); }
            .nav-links a { display: block; padding: 15px 0; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.02); }
            .section-title { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <!-- NAVIGATION BAR -->
    <header id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo-text">
                <img src="images/logo majal.jpeg" alt="Logo" class="nav-logo-img">
                MAJAL
            </a>
            <div class="menu-toggle" id="mobile-menu">
                <i class="fa-solid fa-bars"></i>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>

                <li><a href="organization.html">Organization</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </header>

    <!-- GALLERY HERO -->
    <section class="gallery-hero">
        <div>
            <h1 class="section-title">GALERI <span>MAJAL</span></h1>
        </div>
    </section>

    <!-- CONTENT MODULE -->
    <section class="container" style="padding-top: 40px;">

        <!-- IMAGE REPOSITORY GRID -->
        <div class="gallery-grid">
            
            <div class="gallery-card" onclick="openLightbox(this)">
                <img src="images/Majal1.jpeg" alt="Tactical Formations">

                    <h4>GAMBAR FORMAL MAJAL</h4>

            <div class="gallery-card" onclick="openLightbox(this)">
                <img src="images/Majal2.jpeg" alt="Night Systems Testing">
                <div class="card-overlay">
                    <h4>MAKAN MALAM MAJAL</h4>
                </div>
            </div>

            <div class="gallery-card" onclick="openLightbox(this)">
                <img src="images/Majal3.jpeg" alt="Operational Briefings">
                <div class="card-overlay">
                    <h4>MAKAN MALAM MAJAL</h4>
                </div>
            </div>

            <div class="gallery-card" onclick="openLightbox(this)">
                <img src="images/Majal4.jpeg" alt="High Endurance Drill">

                    <h4>POSE BAHAGIA MAJAL</h4>
                </div>
            </div>
			
			<div class="gallery-card" onclick="openLightbox(this)">
                <img src="images/Majal5.jpeg" alt="High Endurance Drill">
                <div class="card-overlay">
                    <h4>MAJAL MENDUNIA</h4>
                </div>
            </div>
			
			<div class="gallery-card" onclick="openLightbox(this)">
                <img src="images/Majal6.jpeg" alt="High Endurance Drill">
                <div class="card-overlay">
                    <h4>MAJAL BERSAMA HARIMAU</h4>
                </div>
            </div>
			
			<div class="gallery-card" onclick="openLightbox(this)">
                <img src="images/Majal7.jpeg" alt="High Endurance Drill">

			<div class="gallery-card" onclick="openLightbox(this)">
                <img src="images/Majal8.jpeg" alt="High Endurance Drill">

        </div>
    </section>

    <!-- LIGHTBOX INTERACTIVE MODAL COMPONENT -->
    <div class="lightbox" id="lightboxModal">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img src="" alt="Enlarged Vault Asset" class="lightbox-content" id="lightboxImg">
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 MAJAL. Secured Visual Log Files.</p>
    </footer>

    <!-- INTERACTIVE JAVASCRIPT LOGIC -->
    <script>
        // Navbar scroll behavior
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 30) navbar.classList.add('scrolled');
            else navbar.classList.remove('scrolled');
        });

        // Mobile Menu Toggle logic
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.querySelector('.nav-links');

        mobileMenu.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            const icon = mobileMenu.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-xmark');
        });

        // Lightbox Popup Mechanics
        const lightbox = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImg');

        function openLightbox(element) {
            const clickedImgSrc = element.querySelector('img').src;
            lightboxImg.src = clickedImgSrc;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        // Close Lightbox if clicking backdrop background area
        lightbox.addEventListener('click', (e) => {
            if(e.target === lightbox) closeLightbox();
        });

        // ALBUM CLIPBOARD COPY TECHNIQUE
        document.getElementById('albumShareBtn').addEventListener('click', function() {
            const urlToCopy = this.getAttribute('data-share-url');
            
            navigator.clipboard.writeText(urlToCopy).then(() => {
                const originalText = this.innerHTML;
                this.innerHTML = `<i class="fa-solid fa-check"></i> Link Copied!`;
                this.style.borderColor = "var(--gold)";
                this.style.color = "var(--gold)";
                
                setTimeout(() => {
                    this.innerHTML = originalText;
                    this.style.borderColor = "var(--crimson)";
                    this.style.color = "var(--text-white)";
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy link: ', err);
            });
        });
    </script>
</body>
</html>
